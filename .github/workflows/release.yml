name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Installs, checks and packs the library with no publish credential in
  # reach, so a compromised dependency or build step cannot mint one.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The tag must name the version being published.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      # Build the GitHub release notes here, before anything is published, so
      # a tag without a CHANGELOG section stops the release instead of
      # failing after npm already has the package. The file goes in
      # RUNNER_TEMP, outside the checkout, so the checks below never see it.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          if ! sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1
      # No dependency needs its install scripts for the checks to pass, so
      # skip them and give a compromised package one less way in.
      - run: npm ci --ignore-scripts
      # CI checks, the same script as ci.yml.
      - run: npm run verify
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  # Makes SLSA build provenance for the tarball the build job checked and
  # verifies it before anything is published, for the GitHub release. npm
  # makes its own provenance at publish. There is no checkout and no Node:
  # only first-party actions and the gh CLI that ships on the runner. This
  # job's id-token cannot mint an npm credential because the npm trusted
  # publisher names the npm environment and this job has none. If the
  # publisher is ever recreated without an environment, that stops being
  # true.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Attest exactly the tarball this tag should have produced, so a stray
      # file in the artifact is never attested instead.
      - name: Check the artifact holds only the expected tarball
        id: tarball
        run: |
          file="bawdo-blinkstick-${GITHUB_REF_NAME#v}.tgz"
          if [ ! -f "$file" ]; then
            echo "::error::expected $file was not found"
            exit 1
          fi
          for f in ./*.tgz; do
            if [ "$f" != "./$file" ]; then
              echo "::error::unexpected tarball $f"
              exit 1
            fi
          done
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: ${{ steps.tarball.outputs.file }}
      # A bundle that does not verify for this repository, workflow, tag and
      # commit stops the release here, before publish starts.
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          file="bawdo-blinkstick-${GITHUB_REF_NAME#v}.tgz"
          cp "$ATTESTATION_BUNDLE" "$file.sigstore.json"
          gh attestation verify "$file" --bundle "$file.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation
          path: ${{ steps.tarball.outputs.file }}.sigstore.json
          if-no-files-found: error
          retention-days: 1

  # Publishes the tarball the build job checked, once the attest job has
  # verified its provenance. It runs no repository code and installs
  # nothing, so the OIDC token only ever meets npm itself.
  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm environment only accepts v* tags, and the npm trusted publisher
    # names it, so no other run can mint a publish credential.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. Node 24 bundles it, so
      # check the bundled npm rather than download another one.
      - name: Check npm supports trusted publishing
        run: |
          version="$(npm --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$version"; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
      - name: Publish the expected tarball
        # Publish exactly the tarball this tag should have produced, so a
        # stray file in the artifact can never be published instead.
        run: |
          file="bawdo-blinkstick-${GITHUB_REF_NAME#v}.tgz"
          if [ ! -f "$file" ]; then
            echo "::error::expected $file was not found"
            exit 1
          fi
          for f in ./*.tgz; do
            if [ "$f" != "./$file" ]; then
              echo "::error::unexpected tarball $f"
              exit 1
            fi
          done
          npm publish "./$file"

  # Creates the GitHub release once npm has the package, with the notes the
  # build job extracted and the tarball and its attestation as assets. There
  # is no checkout and nothing is installed, so this job's write token
  # reaches only the gh CLI that ships on the runner.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestation
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A published release for the tag, such as one made by hand, is never
        # overwritten: a re-run only uploads whichever of the tarball and
        # attestation it is missing. gh does not see drafts, so a draft for
        # the tag would get a second release beside it.
        run: |
          tag="$GITHUB_REF_NAME"
          file="bawdo-blinkstick-${tag#v}.tgz"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            for asset in "$file" "$file.sigstore.json"; do
              if printf '%s\n' "$existing" | grep -qxF "$asset"; then
                echo "::notice::release $tag already has $asset"
              else
                gh release upload "$tag" "$asset"
              fi
            done
            exit 0
          fi
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file release-notes.md "$file" "$file.sigstore.json"
